  <!-- Клиент на Rust: trunk собирает его под wasm32-unknown-unknown (trunk serve apps/client/web/index.html). -->
  
<script type="module">
import init, * as bindings from './kharos-196e6b1034f3f054.js';
const wasm = await init({ module_or_path: './kharos-196e6b1034f3f054_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <!-- Воркер звуков экрана загрузки (src/sound.rs): страница запускает их по числу ядер. -->
  
  <style>

    #keyboard { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0.01; font-size: 16px; pointer-events: none; -webkit-user-select: text; user-select: text; }
