[package]
name = "kharos-engine"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Движок симуляции Kharos: хранилище мира, журнал, позже — сетки, пути, ход и обзор (docs/engine.md)"

[dependencies]
# Синус, косинус и гипотенуза чистым Rust: натив и wasm считают их одинаково.
libm = "0.2"
serde = { version = "1", features = ["derive"] }
# preserve_order: поля идут в том порядке, в каком записаны; float_roundtrip: дробное читается точно до последнего
# знака, как в JS, — без него парсер ошибается на единицу младшего.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
