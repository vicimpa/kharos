# Синтетический замер подхода «движок на Rust, контент на Luau» (docs/content.md): 10 тыс. юнитов, ходовая — система
# Luau над столбцами, юнит — данные и чертёж. Запуск: cargo run -p content-bench --release
[package]
name = "content-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mlua = { package = "ulua-rt", version = "0.1.7" }
# Замер рендера (src/bin/render.rs) — на стеке клиента rwgpu: окно winit, контекст glutin, рисование glow.
glow = "0.18"
png = "0.17"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
winit = "0.30"
