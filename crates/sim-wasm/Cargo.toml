[package]
name = "kharos-sim-wasm"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Симуляция Kharos в wasm для хоста на TS: плоские функции без wasm-bindgen (docs/boundary.md)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kharos-engine = { path = "../engine", features = ["host-math"] }
kharos-sim = { path = "../sim" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
