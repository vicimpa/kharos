# Cargo workspace: оболочка и крейты симуляции (docs/engine.md, §3). Сборка — в общем target/ в корне.
[workspace]
resolver = "2"
members = ["apps/client", "apps/native", "crates/*"]
# Чужие крейты с нашими правками (vendor/*/VENDORED.md) — не члены рабочей области.
exclude = ["vendor/*"]

[profile.dev]
opt-level = 1

# Прод-сборка окна: символов у рантайма примерно четверть веса, и нужны они только отладчику — у стрипнутого
# бинарника они сняты. Кода в одной части ещё плотнее (одна единица на крейт), но это редкая сборка, её зовут не к
# каждой правке, а к выпуску.
[profile.release]
strip = "symbols"
codegen-units = 1

# Выпуск со всеми оптимизациями: release плюс полный LTO по всем крейтам и обрыв при панике без раскрутки стека.
# Собирается в разы дольше — только к выпуску: `cargo build --profile dist -p kharos-client`.
[profile.dist]
inherits = "release"
lto = "fat"
panic = "abort"

# Luau на Rust с закрытием машины (vendor/ulua-rt/VENDORED.md).
[patch.crates-io]
ulua-rt = { path = "vendor/ulua-rt" }
